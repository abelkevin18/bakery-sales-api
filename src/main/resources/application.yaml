spring:
  application:
    name: bakery-sales-api
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          issuer-uri: ${SUPABASE_URL}/auth/v1
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:invoice_automation_service}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  supabase:
    url: ${SUPABASE_URL}
    storage:
      bucket: ${SUPABASE_STORAGE_BUCKET:media}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
      signed-url-ttl: ${SUPABASE_STORAGE_SIGNED_URL_TTL:300s}
      max-file-size: ${SUPABASE_STORAGE_MAX_FILE_SIZE:5MB}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never